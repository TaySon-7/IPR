apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
      component: backend
  template:
    metadata:
      labels:
        app: django
        component: backend
    spec:
      containers:
        - name: app
          image: ghcr.io/tayson-7/django-app:prometheus
          ports:
            - containerPort: 8000
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.observability.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "django-backend"
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: django-secrets